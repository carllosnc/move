<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shader Gallery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #ui {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: calc(100vw - 32px);
      padding: 8px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      transition: opacity 0.3s ease;
    }

    #ui.hidden { opacity: 0; pointer-events: none; }

    .shader-btn {
      padding: 8px 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      background: transparent;
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .shader-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .shader-btn.active {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
      color: #fff;
    }

    .shader-btn .key {
      opacity: 0.5;
      margin-right: 6px;
      font-size: 11px;
    }

    #error {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      color: #f88;
      font-size: 15px;
      text-align: center;
      padding: 24px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui"></div>
  <div id="error"></div>

  <!-- Shaders (cada um em seu próprio arquivo) -->
  <script src="shaders/nebula.js"></script>
  <script src="shaders/plasma.js"></script>
  <script src="shaders/starfield.js"></script>
  <script src="shaders/mesh-gradient.js"></script>
  <script src="shaders/aurora.js"></script>
  <script src="shaders/fluid.js"></script>
  <script src="shaders/grid.js"></script>
  <script src="shaders/topografia.js"></script>
  <script src="shaders/linhas.js"></script>

  <script src="js/renderer.js"></script>
</body>
</html>
